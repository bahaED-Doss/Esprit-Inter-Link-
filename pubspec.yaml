name: esprit_interlink
description: "Connecting ESPRIT students with internship opportunities"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  file_picker: ^10.3.3
  fl_chart: ^0.66.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.2
  mailer: ^6.6.0
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

  # State Management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  path: ^1.8.3



  # Date & Time
  intl: ^0.19.0

  # Image Picker (for profile pictures)
  image_picker: ^1.0.7


  # Permissions
  permission_handler: ^11.2.0

  # UUID for unique IDs
  uuid: ^4.3.3

  # Email validation
  email_validator: ^2.1.17

  # Encryption (for passwords)
  crypto: ^3.0.3

  # Toast messages
  # fluttertoast: ^8.2.4

  # Shimmer loading effect
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6

# App Icon Configuration
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/logoE.png
    - assets/icons/logo_reversed.png
    - assets/icons/Add.png
    - assets/icons/forget_pass.png
    - assets/icons/check_email.png
    - assets/icons/loadingPage.png
    - assets/icons/succesfulSend.png
    - assets/icons/google_icon.png
    
    

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
